<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Collage Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>
</head>
<body>
  <spline-viewer id="splineBg" url="https://prod.spline.design/kZDDjO5HvS9w3g78/scene.splinecode" loading-anim></spline-viewer>

  <div id="petUploadOverlay" class="pet-upload-overlay">
    <div class="pet-upload-card">
      <div class="pet-upload-icon">🐶🐱</div>
      <h2 data-i18n="upload_pet_title">Загрузите фото питомца</h2>
      <p data-i18n="upload_pet_desc">Выберите качественную фотографию питомца, смотрящего вперед</p>
      <div class="pet-upload-btn-wrapper" style="position: relative; width: 100%; height: 54px;">
        <button class="pet-upload-btn" type="button" data-i18n="choose_file">Выбрать файл</button>
        <input type="file" id="petPhotoInput" accept="image/*" style="position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10;">
      </div>
    </div>
  </div>

  <div class="app">
    <div class="brand">
      <div id="langSwitch" class="lang-btn">RU</div>
      <div class="brand-info">
        <span data-i18n="brand_title">Collage Editor</span>
        <span class="brand-badge" data-i18n="brand_badge">Telegram WebApp</span>
      </div>
    </div>

    <div class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="editorCanvas" width="1024" height="1024"></canvas>
        <div id="gestureLayer"></div>
      </div>
      <div class="hint" data-i18n="hint">Перемещайте, масштабируйте (pinch), вращайте объект</div>
    </div>

    <div class="wardrobe-carousel-container">
      <div class="assets-scroll-lane" id="assetsScrollLane">
        <div class="upload-card-wrapper">
          <div class="custom-upload-trigger">
            ➕<span data-i18n="upload_label">Свой (+2⭐️)</span>
          </div>
          <input type="file" id="customItemInput" accept="image/*">
        </div>
      </div>
    </div>

    <div class="error" id="errorText"></div>

    <div class="controls">
      <button id="doneBtn" type="button" disabled data-i18n="done">Готово</button>
    </div>

    <div id="bottomSheet" class="bottom-sheet">
      <div class="sheet-bar"></div>
      <h3 id="sheetTitle" data-i18n="sheet_title">Настройка анимации</h3>
      <div class="tracks-lane" id="tracksLane"></div>
      <div id="invoiceBlock" class="invoice"></div>
      <button id="confirmRenderBtn" data-i18n="confirm_render">Запустить ИИ-генерацию</button>
    </div>
  </div>

  <script src="app.js?v=8.0"></script>
</body>
</html>
